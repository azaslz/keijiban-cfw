<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>けいじばん</title>
    <link rel="stylesheet" href="/index.css">
    <script src="/index.js" defer></script>
  </head>
  <body>
    <header class="site-header">
      <h1>けいじばん</h1>
      <p class="lead">誰でも気軽に書き込めるシンプルな掲示板です。</p>
    </header>

    <main class="layout">
      <section class="card" aria-labelledby="form-title">
        <h2 id="form-title">新規投稿</h2>
        <form id="post-form" novalidate>
          <label class="field">
            <span class="label">名前 <small>（空欄なら「名無し」）</small></span>
            <input id="name" name="name" type="text" maxlength="50" autocomplete="nickname" placeholder="名無し">
          </label>
          <label class="field">
            <span class="label">本文 <small class="required">必須</small></span>
            <textarea id="body" name="body" rows="5" maxlength="1000" required placeholder="本文を入力してください"></textarea>
            <span class="counter-text"><span id="body-count">0</span> / 1000</span>
          </label>
          <div class="actions">
            <p id="form-status" class="form-status" role="status" aria-live="polite"></p>
            <button id="submit" type="submit">投稿する</button>
          </div>
        </form>
      </section>

      <section aria-labelledby="list-title">
        <div class="list-header">
          <h2 id="list-title">投稿一覧</h2>
          <button id="reload" class="ghost" type="button">更新</button>
        </div>
        <p id="list-status" class="list-status" role="status">読み込み中…</p>
        <ol id="posts" class="posts"></ol>
      </section>
    </main>

    <template id="post-template">
      <li class="post card">
        <div class="post-meta">
          <span class="post-id"></span>
          <span class="post-name"></span>
          <time class="post-time"></time>
        </div>
        <p class="post-body"></p>
      </li>
    </template>
  </body>
</html>
